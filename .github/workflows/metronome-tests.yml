name: Metronome Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metronome-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metronome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: '**/go.sum'
      - name: Set up local workspace
        run: source .github/workflows/scripts/setup-go-workspace.sh
      - name: Test builtin exporter and HTTP integration
        run: make test-metronome
